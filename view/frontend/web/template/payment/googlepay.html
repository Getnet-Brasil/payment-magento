<div class="payment-method form-getnet" css="_active: isActive()" data-bind="attr: {id: 'payment_form_' + getCode()}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               attr="id: getCode()"
               ko-value="getCode()"
               ko-checked="isChecked"
               click="selectPaymentMethod"
               visible="isRadioButtonVisible()">
        </input>
        <label attr="for: getCode()" class="label">
            <span class="payment-method-label">
                <span class="payment-method-label-title" data-bind="text: getTitle()"></span>
            </span>
        </label>
    </div>
    <div class="payment-method-content">
        <each args="getRegion('messages')" render=""></each>
        <form class="form" id="co-payment-form-googlepay" method="post">
            <fieldset class="fieldset payment method" data-bind="attr: {id: 'payment_form_' + getCode() + '_fields'}">
                <div class="field getnet-input-group installments">
                    <div class="control">
                        <select name="payment[cc_installments]"
                                class="select select-year"
                                data-bind="attr: {autocomplete: 'off', id: getCode() + '_installments', 'data-container': getCode() + '-installments'},
                                           options: getCalculeteInstallments(),
                                           optionsValue: 'value',
                                           optionsText: 'installments',
                                           optionsCaption: $t('Select Instalmment'),
                                           value: googlePayInstallment">
                        </select>
                        <label data-bind="attr: {for: getCode() + '_installments'}" class="label">
                            <span><!-- ko i18n: 'Select Instalmment' --><!-- /ko --></span>
                        </label>
                    </div>
                </div>
            </fieldset>
        </form>
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <each args="$parent.getRegion('before-place-order')" render=""></each>
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <!-- ko if: googlePayChecked() && !googlePayReady() -->
                <div class="message notice">
                    <span translate="'Google Pay is not available on this device or browser. Please choose another payment method.'"></span>
                </div>
                <!-- /ko -->
                <!-- ko if: googlePayReady() && !googlePayInstallment() -->
                <div class="message notice">
                    <span translate="'Select the installments to continue with Google Pay.'"></span>
                </div>
                <!-- /ko -->
                <div class="getnet-googlepay-button"
                     data-bind="visible: canPay(), afterRender: function (element) { renderButton(element); }"></div>
            </div>
        </div>
        <render args="fingerPrint" if="FraudManager()"></render>
    </div>
</div>
